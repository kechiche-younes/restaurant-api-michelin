spring:
  application:
    name: restaurant-api

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.bober.ovh/realms/master
          jwk-set-uri: https://keycloak.bober.ovh/realms/master/protocol/openid-connect/certs

  datasource:
    url: jdbc:h2:file:./database
    driver-class-name: org.h2.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console
s3:
  endpoint: https://s3.bober.ovh
  region: us-east-1
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  bucket-restaurant: restaurant
  bucket-evaluation: evaluation
